services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: balancequeue
      POSTGRES_PASSWORD: balancequeue
      POSTGRES_DB: balancequeue
    command: ["postgres", "-c", "max_connections=250"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancequeue"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5434:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://balancequeue:balancequeue@db:5432/balancequeue
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8010"
