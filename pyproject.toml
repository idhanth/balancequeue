[project]
name = "balancequeue"
version = "0.1.0"
description = "Concurrency-safe 5v5 Elo matchmaking service (FastAPI + PostgreSQL)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Idhanth Premkumar" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.52.4",
]

[project.urls]
Repository = "https://github.com/idhanth/balancequeue"

[project.scripts]
balancequeue = "balancequeue:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Emitted by Starlette's TestClient about its own dependencies, not by this project.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
