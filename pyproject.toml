[project]
name = "balancequeue"
version = "0.1.0"
description = "Concurrency-safe 5v5 Elo matchmaking service (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
balancequeue = "balancequeue:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
